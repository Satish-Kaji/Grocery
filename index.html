<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pantry</title>

  <!-- PWA / iPhone home screen settings -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2f6b4f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pantry">
  <link rel="apple-touch-icon" href="icons/icon-180.png">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1 id="page-title">Grocery</h1>
    <button id="add-btn" class="round-btn" aria-label="Add">+</button>
  </header>

  <main>
    <!-- Pantry tab -->
    <section id="tab-pantry" class="tab active">
      <input type="search" id="search" placeholder="Search pantry...">
      <div id="pantry-list"></div>
    </section>

    <!-- Expiring soon tab -->
    <section id="tab-expiring" class="tab">
      <p class="hint">Items that are expired or expire in the next 3 days.</p>
      <div id="expiring-list"></div>
    </section>

    <!-- Shopping list tab -->
    <section id="tab-shopping" class="tab">
      <form id="shop-form" class="inline-form">
        <input type="text" id="shop-name" placeholder="Add to shopping list..." required>
        <button type="submit">Add</button>
      </form>
      <div id="shopping-list"></div>
      <div class="row-buttons">
        <button id="clear-checked" class="secondary">Remove checked</button>
      </div>
    </section>

    <!-- Settings tab -->
    <section id="tab-settings" class="tab">
      <div class="card">
        <h3>Backup</h3>
        <p class="hint">Your data only lives on this phone. Export a backup now and then.</p>
        <button id="export-btn">Export backup</button>
        <label class="file-btn secondary">
          Import backup
          <input type="file" id="import-file" accept=".json,application/json" hidden>
        </label>
      </div>
      <div class="card">
        <h3>Reminders</h3>
        <label>Remind me
          <select id="remind-days">
            <option value="0">on the expiry day</option>
            <option value="1">1 day before</option>
            <option value="2">2 days before</option>
            <option value="3">3 days before</option>
          </select>
        </label>
      </div>
    </section>
  </main>

  <nav>
    <button data-tab="pantry" class="active">Pantry</button>
    <button data-tab="expiring">Expiring <span id="expiring-count" class="badge" hidden></span></button>
    <button data-tab="shopping">Shopping</button>
    <button data-tab="settings">Settings</button>
  </nav>

  <!-- Add / edit item dialog -->
  <dialog id="item-dialog">
    <form id="item-form" method="dialog">
      <h2 id="dialog-title">Add item</h2>
      <input type="hidden" id="item-id">

      <label>Name
        <input type="text" id="item-name" required>
      </label>

      <div class="two-cols">
        <label>Quantity
          <input type="number" id="item-qty" min="0" step="any" value="1">
        </label>
        <label>Unit
          <select id="item-unit">
            <option>pcs</option>
            <option>g</option>
            <option>kg</option>
            <option>ml</option>
            <option>l</option>
            <option>pack</option>
          </select>
        </label>
      </div>

      <div class="two-cols">
        <label>Category
          <select id="item-category">
            <option>Fruit &amp; Veg</option>
            <option>Dairy</option>
            <option>Meat &amp; Fish</option>
            <option>Bakery</option>
            <option>Dry goods</option>
            <option>Frozen</option>
            <option>Drinks</option>
            <option>Other</option>
          </select>
        </label>
        <label>Location
          <select id="item-location">
            <option>Fridge</option>
            <option>Freezer</option>
            <option>Pantry</option>
          </select>
        </label>
      </div>

      <label>Expiry date (optional)
        <input type="date" id="item-expiry">
      </label>

      <div class="row-buttons">
        <button type="button" id="cancel-btn" class="secondary">Cancel</button>
        <button type="submit" id="save-btn">Save</button>
      </div>
    </form>
  </dialog>

  <script src="dexie.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
